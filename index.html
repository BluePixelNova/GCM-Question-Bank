  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @keyframes bgShift { 0% {background-position:0% 50%;} 50% {background-position:100% 50%;} 100% {background-position:0% 50%;} }
    @keyframes fadeIn { from {opacity:0; transform:translateY(10px);} to {opacity:1; transform:translateY(0);} }
    @keyframes glowMove { 0% {background-position:30% 40%;} 100% {background-position:70% 60%;} }
    @keyframes fadeSlide { from {opacity:0; transform:translateY(20px);} to {opacity:1; transform:translateY(0);} }
    
    body {
      font-family: 'Poppins', sans-serif;
    }

    .animate-bg-shift {
      background-size: 200% 200%;
      animation: bgShift 12s ease-in-out infinite;
    }

    .animate-fade-in {
      animation: fadeIn 1.2s ease-in forwards;
    }

    .animate-fade-slide {
      animation: fadeSlide 0.6s ease forwards;
    }

    .glow-overlay::before {
      content: '';
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: radial-gradient(circle at 50% 50%, rgba(0,153,255,0.15), transparent 70%);
      animation: glowMove 10s infinite alternate ease-in-out;
      pointer-events: none;
      z-index: 0;
    }

    /* Hide scrollbar but keep functionality */
    ::-webkit-scrollbar {
      width: 8px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(0, 188, 212, 0.3);
      border-radius: 10px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(0, 188, 212, 0.5);
    }
  </style>
